# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: pendiego/SiteCADe
  branch: main
  base_url: https://cadeufpel.com
  auth_endpoint: api/cms/auth
site_url: https://cadeufpel.com
media_folder: /public/assets/uploads
public_folder: /assets/uploads
media_libraries:
  default:
    config:
      max_file_size: 5242880
      slugify_filename: true
      transformations:
        raster_image: { format: webp, quality: 85, width: 2048, height: 2048 }
        svg: { optimize: true }
collections:
  - name: configuracoes
    label: "Configurações"
    files:
      - name: site
        label: "Site e contato"
        file: content/site.json
        editor: { preview: false }
        fields:
          - { name: url, label: "URL do site", widget: string, required: true }
          - { name: nome, label: "Nome", widget: string, required: true }
          - { name: nomeCompleto, label: "Nome completo", widget: string, required: true }
          - { name: nomesAlternativos, label: "Nomes alternativos", widget: list, required: true, field: { name: item, label: "Nome", widget: string } }
          - { name: descricao, label: "Descrição do site", widget: string, required: true }
          - { name: descricaoOrganizacao, label: "Descrição da organização", widget: string, required: true }
          - { name: email, label: "E-mail", widget: string, required: true }
          - { name: instagramUrl, label: "Instagram (URL)", widget: string, required: true }
          - { name: instagramUsuario, label: "Instagram (usuário)", widget: string, required: true }
          - { name: githubUrl, label: "GitHub (URL)", widget: string, required: true }
          - name: endereco
            label: "Endereço"
            widget: object
            required: true
            fields:
              - { name: rua, label: "Rua", widget: string, required: true }
              - { name: cidade, label: "Cidade", widget: string, required: true }
              - { name: uf, label: "UF", widget: string, required: true }
              - { name: pais, label: "País", widget: string, required: true }
              - { name: regiao, label: "Região", widget: string, required: true }
              - { name: texto, label: "Endereço por extenso", widget: string, required: true }
          - name: universidade
            label: "Universidade"
            widget: object
            required: true
            fields:
              - { name: nome, label: "Nome", widget: string, required: true }
              - { name: sigla, label: "Sigla", widget: string, required: true }
              - { name: url, label: "Site", widget: string, required: true }
          - { name: ogImagem, label: "Imagem de compartilhamento (caminho)", widget: string, required: true }
      - name: navegacao
        label: "Menu de navegação"
        file: content/navegacao.json
        editor: { preview: false }
        fields:
          - name: links
            label: "Links"
            widget: list
            required: true
            summary: '{{fields.rotulo}}'
            fields:
              - { name: rotulo, label: "Rótulo", widget: string, required: true }
              - { name: href, label: "Destino (href)", widget: string, required: true }
          - name: cta
            label: "Botão de destaque"
            widget: object
            required: true
            fields:
              - { name: rotulo, label: "Rótulo", widget: string, required: true }
              - { name: href, label: "Destino (href)", widget: string, required: true }
      - name: rodape
        label: "Rodapé"
        file: content/rodape.json
        editor: { preview: false }
        fields:
          - { name: tagline, label: "Tagline", widget: string, required: true }
          - { name: contatoTitulo, label: "Título do contato", widget: string, required: true }
          - name: colunas
            label: "Colunas"
            widget: list
            required: true
            summary: '{{fields.titulo}}'
            fields:
              - { name: titulo, label: "Título da coluna", widget: string, required: true }
              - name: links
                label: "Links"
                widget: list
                required: true
                summary: '{{fields.rotulo}}'
                fields:
                  - { name: rotulo, label: "Rótulo", widget: string, required: true }
                  - { name: href, label: "Destino (href)", widget: string, required: true }
          - { name: copyright, label: "Copyright", widget: string, required: true }
          - { name: notaPrivacidade, label: "Nota de privacidade", widget: richtext, buttons: [bold, italic, link], editor_components: [], required: true }
          - { name: githubRotulo, label: "Rótulo do GitHub", widget: string, required: true }
      - name: integracoes
        label: "Integrações Google"
        file: content/integracoes.json
        editor: { preview: false }
        fields:
          - { name: googleCalendarId, label: "ID do Google Agenda", widget: string, required: true }
          - { name: calendarioAssinarUrl, label: "Link para assinar a agenda", widget: string, required: true }
          - { name: drivePastaGaleria, label: "ID da pasta de fotos (Drive)", widget: string, required: true }
          - { name: drivePastaMateriais, label: "ID da pasta de materiais (Drive)", widget: string, required: true }
      - name: llms
        label: "Instruções para agentes (llms.txt)"
        file: content/llms.json
        editor: { preview: false }
        fields:
          - { name: texto, label: "Texto do llms.txt", widget: text, required: true }
  - name: inicio
    label: "Página inicial"
    files:
      - name: seo
        label: "SEO e para agentes"
        file: content/inicio/seo.json
        editor: { preview: false }
        fields:
          - name: seo
            label: "SEO"
            widget: object
            required: true
            fields:
              - { name: titulo, label: "Título da página", widget: string, required: true }
              - { name: tituloSocial, label: "Título em redes sociais", widget: string, required: true }
              - { name: descricao, label: "Descrição", widget: string, required: true }
          - name: agentes
            label: "Para agentes"
            widget: object
            required: true
            fields:
              - { name: titulo, label: "Título", widget: string, required: true }
              - { name: resumo, label: "Resumo", widget: richtext, buttons: [bold, italic, link, bulleted-list, numbered-list, heading-three], editor_components: [], required: false }
      - name: hero
        label: "Destaques (hero)"
        file: content/inicio/hero.json
        editor: { preview: false }
        fields:
          - name: slides
            label: "Slides"
            widget: list
            required: true
            summary: '{{fields.titulo}}'
            fields:
              - { name: id, label: "Identificador", widget: string, required: true, pattern: ['^[a-z0-9-]+$', 'Use só minúsculas, números e hífen'], hint: 'Identificador técnico único (data-od-id). Não altere em itens existentes.' }
              - { name: acento, label: "Cor de destaque", widget: select, options: [navy, ciano, amarelo, verde], required: true }
              - { name: eyebrow, label: "Chamada", widget: string, required: true }
              - { name: titulo, label: "Título", widget: string, required: true }
              - { name: subtitulo, label: "Subtítulo", widget: string, required: true }
              - { name: ctaRotulo, label: "Texto do botão", widget: string, required: true }
              - { name: ctaHref, label: "Destino do botão", widget: string, required: true }
              - { name: mascote, label: "Mascote", widget: image, choose_url: false, media_folder: /public/assets/uploads/hero, public_folder: /assets/uploads/hero, required: true }
              - { name: mascoteAlt, label: "Texto alternativo da mascote", widget: string, required: false, hint: "Deixe vazio para mascotes decorativas." }
              - { name: mascoteLargura, label: "Largura da mascote (px)", widget: number, value_type: int, required: true }
              - { name: mascoteAltura, label: "Altura da mascote (px)", widget: number, value_type: int, required: true }
      - name: agenda
        label: "Agenda"
        file: content/inicio/agenda.json
        editor: { preview: false }
        fields:
          - { name: eyebrow, label: "Chamada", widget: string, required: true }
          - { name: titulo, label: "Título", widget: string, required: true }
          - { name: ctaRotulo, label: "Texto do botão", widget: string, required: true }
          - { name: rotuloDetalhe, label: "Rótulo do detalhe", widget: string, required: true }
          - { name: carregando, label: "Texto de carregamento", widget: string, required: true }
          - { name: noscript, label: "Texto sem JavaScript", widget: string, required: true }
          - name: mensagens
            label: "Mensagens"
            widget: object
            required: true
            fields:
              - { name: semTitulo, label: "Evento sem título", widget: string, required: true }
              - { name: semDescricao, label: "Evento sem descrição", widget: string, required: true }
              - { name: nenhumFuturo, label: "Nenhum evento futuro", widget: string, required: true }
              - { name: proximoEvento, label: "Rótulo do próximo evento", widget: string, required: true }
              - { name: ultimoEvento, label: "Rótulo do último evento", widget: string, required: true }
              - { name: semEventosData, label: "Sem eventos nesta data", widget: string, required: true }
              - { name: semEventosTitulo, label: "Sem eventos (título)", widget: string, required: true }
              - { name: semEventosDesc, label: "Sem eventos (descrição)", widget: string, required: true }
              - { name: diaSemEventoTitulo, label: "Dia sem evento (título)", widget: string, required: true }
              - { name: diaSemEventoDesc, label: "Dia sem evento (descrição)", widget: string, required: true }
              - { name: indisponivelTitulo, label: "Agenda indisponível (título)", widget: string, required: true }
              - { name: indisponivelDesc, label: "Agenda indisponível (descrição)", widget: string, required: true }
      - name: quem-somos
        label: "Quem somos"
        file: content/inicio/quem-somos.json
        editor: { preview: false }
        fields:
          - { name: eyebrow, label: "Chamada", widget: string, required: true }
          - { name: titulo, label: "Título", widget: string, required: true }
          - { name: texto, label: "Texto", widget: text, required: true }
          - { name: gestaoTitulo, label: "Título da gestão", widget: string, required: true }
          - name: membros
            label: "Membros da gestão"
            widget: list
            required: true
            summary: '{{fields.nome}}'
            fields:
              - { name: nome, label: "Nome", widget: string, required: true }
              - { name: foto, label: "Foto", widget: image, choose_url: false, media_folder: /public/assets/uploads/gestao, public_folder: /assets/uploads/gestao, required: true }
              - { name: enquadramento, label: "Cargo ou enquadramento", widget: string, required: true }
      - name: historico
        label: "Histórico"
        file: content/inicio/historico.json
        editor: { preview: false }
        fields:
          - { name: eyebrow, label: "Chamada", widget: string, required: true }
          - { name: titulo, label: "Título", widget: string, required: true }
          - { name: lead, label: "Introdução", widget: text, required: true }
          - { name: nota, label: "Nota", widget: string, required: true }
          - { name: noscript, label: "Texto sem JavaScript", widget: string, required: true }
          - { name: verTudoRotulo, label: "Texto do link 'ver tudo'", widget: string, required: true }
          - name: mensagens
            label: "Mensagens"
            widget: object
            required: true
            fields:
              - { name: carregando, label: "Carregando", widget: string, required: true }
              - { name: vazio, label: "Sem itens", widget: string, required: true }
              - { name: erro, label: "Erro", widget: string, required: true }
      - name: lojinha
        label: "Lojinha"
        file: content/inicio/lojinha.json
        editor: { preview: false }
        fields:
          - { name: eyebrow, label: "Chamada", widget: string, required: true }
          - { name: titulo, label: "Título", widget: string, required: true }
          - { name: lead, label: "Introdução", widget: text, required: true }
          - { name: badgeRotulo, label: "Texto do selo", widget: string, required: true }
          - { name: badgeHref, label: "Destino do selo", widget: string, required: true }
          - { name: hoverRotulo, label: "Texto ao passar o mouse", widget: string, required: true }
          - name: produtos
            label: "Produtos"
            widget: list
            required: true
            summary: '{{fields.titulo}}'
            fields:
              - { name: id, label: "Identificador", widget: string, required: true, pattern: ['^[a-z0-9-]+$', 'Use só minúsculas, números e hífen'], hint: 'Identificador técnico único (data-od-id). Não altere em itens existentes.' }
              - { name: titulo, label: "Título", widget: string, required: true }
              - { name: subtitulo, label: "Subtítulo", widget: string, required: true }
              - { name: imagem, label: "Imagem", widget: image, choose_url: false, media_folder: /public/assets/uploads/produtos, public_folder: /assets/uploads/produtos, required: true }
              - { name: alt, label: "Texto alternativo", widget: string, required: true }
              - { name: href, label: "Destino", widget: string, required: true }
          - name: cta
            label: "Cartão de chamada"
            widget: object
            required: true
            fields:
              - { name: titulo, label: "Título", widget: string, required: true }
              - { name: subtitulo, label: "Subtítulo", widget: string, required: true }
              - { name: href, label: "Destino", widget: string, required: true }
          - { name: nota, label: "Nota", widget: string, required: true }
      - name: guia
        label: "Guia do calouro"
        file: content/inicio/guia.json
        editor: { preview: false }
        fields:
          - { name: eyebrow, label: "Chamada", widget: string, required: true }
          - { name: titulo, label: "Título", widget: string, required: true }
          - { name: lead, label: "Introdução", widget: text, required: true }
          - { name: foto, label: "Foto", widget: image, choose_url: false, media_folder: /public/assets/uploads/guia, public_folder: /assets/uploads/guia, required: true }
          - { name: fotoLegenda, label: "Legenda da foto", widget: string, required: true }
          - name: cards
            label: "Cartões"
            widget: list
            required: true
            summary: '{{fields.titulo}}'
            fields:
              - { name: id, label: "Identificador", widget: string, required: true, pattern: ['^[a-z0-9-]+$', 'Use só minúsculas, números e hífen'], hint: 'Identificador técnico único (data-od-id). Não altere em itens existentes.' }
              - { name: tipo, label: "Tipo", widget: select, options: [link, materiais], required: true }
              - { name: titulo, label: "Título", widget: string, required: true }
              - { name: texto, label: "Texto", widget: text, required: true }
              - { name: href, label: "Destino", widget: string, required: false }
          - name: materiais
            label: "Materiais"
            widget: object
            required: true
            fields:
              - { name: titulo, label: "Título", widget: string, required: true }
              - { name: carregando, label: "Carregando", widget: string, required: true }
              - { name: vazio, label: "Sem materiais", widget: string, required: true }
              - { name: erro, label: "Erro", widget: string, required: true }
      - name: oportunidades
        label: "Oportunidades — textos da seção"
        file: content/inicio/oportunidades.json
        editor: { preview: false }
        fields:
          - { name: eyebrow, label: "Chamada", widget: string, required: true }
          - { name: titulo, label: "Título", widget: string, required: true }
          - { name: lead, label: "Introdução", widget: text, required: true }
          - { name: ctaRotulo, label: "Texto do botão", widget: string, required: true }
          - { name: ctaHref, label: "Destino do botão", widget: string, required: true }
          - { name: vazio, label: "Sem oportunidades", widget: string, required: true }
          - { name: verDetalhes, label: "Texto 'ver detalhes'", widget: string, required: true }
      - name: faq
        label: "Perguntas frequentes"
        file: content/inicio/faq.json
        editor: { preview: false }
        fields:
          - { name: eyebrow, label: "Chamada", widget: string, required: true }
          - { name: titulo, label: "Título", widget: string, required: true }
          - { name: texto, label: "Texto", widget: text, required: true }
          - name: itens
            label: "Perguntas"
            widget: list
            required: true
            summary: '{{fields.pergunta}}'
            fields:
              - { name: id, label: "Identificador", widget: string, required: true, pattern: ['^[a-z0-9-]+$', 'Use só minúsculas, números e hífen'], hint: 'Identificador técnico único (data-od-id). Não altere em itens existentes.' }
              - { name: pergunta, label: "Pergunta", widget: string, required: true }
              - { name: resposta, label: "Resposta", widget: richtext, buttons: [bold, italic, link], editor_components: [], required: true }
              - { name: aberto, label: "Aberta por padrão", widget: boolean, default: false, required: true }
      - name: atalhos
        label: "Atalhos"
        file: content/inicio/atalhos.json
        editor: { preview: false }
        fields:
          - { name: eyebrow, label: "Chamada", widget: string, required: true }
          - { name: titulo, label: "Título", widget: string, required: true }
          - name: itens
            label: "Atalhos"
            widget: list
            required: true
            summary: '{{fields.titulo}}'
            fields:
              - { name: id, label: "Identificador", widget: string, required: true, pattern: ['^[a-z0-9-]+$', 'Use só minúsculas, números e hífen'], hint: 'Identificador técnico único (data-od-id). Não altere em itens existentes.' }
              - { name: titulo, label: "Título", widget: string, required: true }
              - { name: subtitulo, label: "Subtítulo", widget: string, required: true }
              - { name: href, label: "Destino", widget: string, required: true }
              - { name: novaAba, label: "Abrir em nova aba", widget: boolean, default: false, required: true }
      - name: formularios
        label: "Formulários"
        file: content/inicio/formularios.json
        editor: { preview: false }
        fields:
          - { name: eyebrow, label: "Chamada", widget: string, required: true }
          - { name: titulo, label: "Título", widget: string, required: true }
          - name: participar
            label: "Quero participar"
            widget: object
            required: true
            fields:
              - { name: titulo, label: "Título", widget: string, required: true }
              - { name: texto, label: "Texto", widget: text, required: true }
              - { name: nomeRotulo, label: "Rótulo do nome", widget: string, required: true }
              - { name: nomePlaceholder, label: "Dica do nome", widget: string, required: true }
              - { name: emailRotulo, label: "Rótulo do e-mail", widget: string, required: true }
              - { name: emailPlaceholder, label: "Dica do e-mail", widget: string, required: true }
              - { name: semestreRotulo, label: "Rótulo do semestre", widget: string, required: true }
              - { name: semestres, label: "Semestres", widget: list, required: true, field: { name: item, label: "Semestre", widget: string } }
              - { name: areaRotulo, label: "Rótulo da área", widget: string, required: true }
              - { name: areas, label: "Áreas", widget: list, required: true, field: { name: item, label: "Área", widget: string } }
              - { name: selecione, label: "Texto 'selecione'", widget: string, required: true }
              - { name: enviarRotulo, label: "Texto do botão enviar", widget: string, required: true }
              - { name: nota, label: "Nota", widget: string, required: true }
          - name: falar
            label: "Quero falar"
            widget: object
            required: true
            fields:
              - { name: titulo, label: "Título", widget: string, required: true }
              - { name: tipoRotulo, label: "Rótulo do tipo", widget: string, required: true }
              - name: tipos
                label: "Tipos"
                widget: object
                required: true
                fields:
                  - name: reclamacao
                    label: "Reclamação"
                    widget: object
                    required: true
                    fields:
                      - { name: rotulo, label: "Rótulo", widget: string, required: true }
                      - { name: nota, label: "Nota", widget: string, required: true }
                  - name: sugestao
                    label: "Sugestão"
                    widget: object
                    required: true
                    fields:
                      - { name: rotulo, label: "Rótulo", widget: string, required: true }
                      - { name: nota, label: "Nota", widget: string, required: true }
                  - name: elogio
                    label: "Elogio"
                    widget: object
                    required: true
                    fields:
                      - { name: rotulo, label: "Rótulo", widget: string, required: true }
                      - { name: nota, label: "Nota", widget: string, required: true }
                  - name: oportunidade
                    label: "Oportunidade"
                    widget: object
                    required: true
                    fields:
                      - { name: rotulo, label: "Rótulo", widget: string, required: true }
                      - { name: nota, label: "Nota", widget: string, required: true }
              - { name: assuntoRotulo, label: "Rótulo do assunto", widget: string, required: true }
              - { name: assuntoPlaceholder, label: "Dica do assunto", widget: string, required: true }
              - { name: mensagemRotulo, label: "Rótulo da mensagem", widget: string, required: true }
              - { name: mensagemPlaceholder, label: "Dica da mensagem", widget: string, required: true }
              - { name: anonimoRotulo, label: "Rótulo do envio anônimo", widget: string, required: true }
              - { name: contatoRotulo, label: "Rótulo do contato", widget: string, required: true }
              - { name: contatoPlaceholder, label: "Dica do contato", widget: string, required: true }
              - { name: notaAnonimo, label: "Nota do envio anônimo", widget: string, required: true }
              - { name: enviarRotulo, label: "Texto do botão enviar", widget: string, required: true }
          - name: mensagens
            label: "Mensagens"
            widget: object
            required: true
            fields:
              - { name: enviando, label: "Enviando", widget: string, required: true }
              - { name: sucesso, label: "Sucesso", widget: string, required: true }
              - { name: erro, label: "Erro", widget: string, required: true }
  - name: oportunidades
    label: "Oportunidades"
    files:
      - name: oportunidades
        label: "Oportunidades"
        file: content/oportunidades.json
        editor: { preview: false }
        fields:
          - name: itens
            label: "Oportunidades"
            widget: list
            required: true
            summary: '{{fields.titulo}}'
            fields:
              - { name: publicado, label: "Publicado", widget: boolean, default: true, required: true }
              - { name: titulo, label: "Título", widget: string, required: true }
              - { name: tag, label: "Etiqueta", widget: string, required: true }
              - { name: cor, label: "Cor", widget: select, options: [verde, amarelo, ciano], default: verde, required: true }
              - { name: resumo, label: "Resumo", widget: text, required: false }
              - { name: texto, label: "Texto", widget: text, required: false }
              - { name: cta, label: "Chamada para ação", widget: string, required: false }
              - { name: link, label: "Link", widget: string, required: false }
              - { name: expira, label: "Expira em", widget: datetime, type: date, required: false }
  - name: paginas
    label: "Páginas"
    files:
      - name: sobre
        label: "Sobre"
        file: content/paginas/sobre.json
        editor: { preview: false }
        fields: &paginaInstitucional
          - name: seo
            label: "SEO"
            widget: object
            required: true
            fields:
              - { name: titulo, label: "Título da página", widget: string, required: true }
              - { name: tituloSocial, label: "Título em redes sociais", widget: string, required: true }
              - { name: descricao, label: "Descrição", widget: string, required: true }
          - { name: eyebrow, label: "Chamada", widget: string, required: true }
          - { name: titulo, label: "Título", widget: string, required: true }
          - { name: lead, label: "Introdução", widget: text, required: true }
          - name: secoes
            label: "Seções"
            widget: list
            required: true
            summary: '{{fields.titulo}}'
            fields:
              - { name: titulo, label: "Título da seção", widget: string, required: true }
              - { name: estilo, label: "Estilo", widget: select, options: [texto, canais], required: true }
